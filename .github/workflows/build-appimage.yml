name: Build AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependency
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-venv xdotool
      - name: Build AppImage
        run: ./build-appimage.sh
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeKeyClicker-x86_64-AppImage
          path: build/appimage/dist/HomeKeyClicker-x86_64.AppImage
      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          build/appimage/dist/HomeKeyClicker-x86_64.AppImage
          --title "Home Key Clicker $GITHUB_REF_NAME"
          --generate-notes
